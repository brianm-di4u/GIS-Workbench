# Universal import (REQ-SDC-09): ask every installed tool whether it recognises the file. Each step
# is optional and its JSON goes into the job result; the service then names the matching profile.
id = "probe"
title = "Identify a file"
module = "core-gdal"
input = "any"
output_ext = ""
time_limit_s = 300
cpu_limit_s = 600
memory_mb = 2048

[[steps]]
tool = "gdalinfo"
capture = "gdal"
optional = true
args = ["-json", "-norat", "-noct", "{input}"]

[[steps]]
tool = "ogrinfo"
capture = "ogr"
optional = true
args = ["-json", "-so", "-al", "{input}"]

[[steps]]
tool = "pdal"
capture = "pdal"
optional = true
args = ["info", "--summary", "{input}"]

[[steps]]
tool = "ffprobe"
capture = "ffprobe"
optional = true
args = ["-v", "error", "-print_format", "json", "-show_format", "-show_streams", "{input}"]
