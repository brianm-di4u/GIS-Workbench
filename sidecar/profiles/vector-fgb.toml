# Vector -> FlatGeobuf (REQ-SDC-08), single layer, with its packed R-tree.
id = "vector-fgb"
title = "Vector to FlatGeobuf"
module = "core-gdal"
input = "vector"
output_ext = "fgb"

[[options]]
name = "t_srs"
title = "Reproject to"
type = "crs"
optional = true

[[options]]
name = "multi"
title = "Promote to multi-geometries"
type = "bool"
default = false

[[steps]]
tool = "ogr2ogr"
progress = "gdal"
args = [
  "-progress",
  "-f", "FlatGeobuf",
  "-lco", "SPATIAL_INDEX=YES",
  { when = "t_srs", args = ["-t_srs", "{t_srs}"] },
  { when = "multi", args = ["-nlt", "PROMOTE_TO_MULTI"] },
  "{output}", "{input}",
]
