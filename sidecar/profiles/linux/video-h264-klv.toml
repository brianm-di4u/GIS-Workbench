# Linux build of the "video-h264-klv" profile (P16): MPEG-2 (H.262) video in a transport or
# program stream -> MPEG-1 video in MPEG-TS with every KLV stream copied and its timing kept.
# The id stays "video-h264-klv" so every 2.1+ app offers it for MPEG-2 clips. Linux has no
# operating-system H.264 encoder (Windows uses Media Foundation, S-49) and the Media module's ffmpeg
# has no OpenH264 (OD-2.30; video-h264-openh264 is the route through Cisco's binary); MPEG-1 is
# patent-free and GIS Workbench decodes it
# itself (FC-22), so the result plays in the FMV player with KLV sync in every app build.
# MPEG-1 has no B-frames here (-bf 0) and keeps the source frame rate where MPEG-1 allows it.
id = "video-h264-klv"
title = "MPEG-2 video to MPEG-1 MPEG-TS (KLV kept)"
module = "media"
input = "video"
output_ext = "ts"
output_name = "{stem}.mpeg1"
memory_mb = 4096

[[options]]
name = "container"
title = "Input container"
type = "enum"
values = ["mpegts", "mpeg"]
default = "mpegts"

[[options]]
name = "encoder"
title = "Video encoder"
type = "enum"
values = ["mpeg1video"]
default = "mpeg1video"

[[options]]
name = "bitrate"
title = "Video bitrate (kbit/s)"
type = "int"
min = 100
max = 100000
default = 8000

[[options]]
name = "gop"
title = "Keyframe interval (frames)"
type = "int"
min = 1
max = 600
default = 15

[[steps]]
tool = "ffmpeg"
progress = "ffmpeg"
args = [
  "-hide_banner", "-nostdin", "-y",
  "-protocol_whitelist", "file,pipe",
  "-progress", "pipe:1", "-nostats",
  "-copyts",
  "-f", "{container}",
  "-i", "{input}",
  "-map", "0", "-ignore_unknown",
  "-c", "copy",
  "-c:v", "{encoder}", "-b:v", "{bitrate}k", "-maxrate", "{bitrate}k", "-bufsize", "{bitrate}k", "-g", "{gop}", "-bf", "0", "-pix_fmt", "yuv420p", "-fpsmax", "60",
  "-muxdelay", "0", "-muxpreload", "0",
  "-metadata", "comment={provenance}",
  "-f", "mpegts", "-mpegts_copyts", "1",
  "{output}",
]
