# REQ-RUST-13 / REQ-SDC-12 for the native sidecar: permissive crate licences only (no GPL/LGPL/AGPL
# in the service itself), advisories checked, crates only from crates.io.
[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
