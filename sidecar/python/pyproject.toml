[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-workbench-client"
version = "0.1.0"
description = "Drive GIS Workbench from Python through the sidecar's loopback relay; writes stay proposals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux"]

[tool.setuptools.packages.find]
where = ["src"]
