[package]
name = "gwb-sidecar"
description = "GIS Workbench sidecar: a loopback-only conversion service for formats the browser cannot read"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gwb-sidecar"
path = "src/main.rs"

[[bin]]
name = "gwb-sidecar-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "gwb-fake-tool"
path = "src/bin/fake-tool.rs"
test = false

[lib]
name = "gwb_sidecar"
path = "src/lib.rs"

[features]
default = []
# The CSM plug-in host (REQ-GAP-25). OD-2.18: it stays out of every shipped build until the sidecar
# is signed and has passed its external security review. No package sets this feature, and
# sidecar/installer/gates.mjs refuses a stage whose binary has it.
csm-host = []
# The outbound CORS relay (REQ-GAP-08). Never set in a shipped build: it stays out until the sidecar
# is signed and has passed its external security review, and the package gate refuses a binary that
# holds it (OD-2.17). Test builds only: cargo test --features cors-relay.
cors-relay = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs", "dep:hyper", "dep:hyper-util"]
# The air-gapped variant: the relay can never be compiled into it.
airgap = []

[dependencies]
gwb-sidecar-api = { path = "../gwb-sidecar-api" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
bytes = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
quick-xml = "0.41"
# The CORS relay (REQ-GAP-08). Optional, and no release build turns it on (OD-2.17).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
hyper = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Security_Isolation",
  "Win32_Security_WinTrust",
  "Win32_System_Pipes",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
