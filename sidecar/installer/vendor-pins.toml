# Vendor decode plug-ins fetched by gwb-sidecar-setup from OSGeo4W at install time (S-44, REQ-SDC-12).
# They are never part of the sidecar packages. Pinned to the exact package and SHA-256 that were
# tested against the bundled Core GDAL (conda-forge libgdal-core 3.13.3): the plug-ins are C++ and
# need the same GDAL minor version. A newer OSGeo4W build is not taken until these pins change.
mirror = "https://download.osgeo.org/osgeo4w/v2"
gdal_minor = "3.13"

[mrsid]
title = "MrSID decode plug-in (Extensis MrSID Decode SDK, via OSGeo4W gdal-mrsid)"
module = "vendor-mrsid"
package = "gdal-mrsid"
version = "3.13.3-3"
path = "x86_64/release/gdal/gdal-mrsid/gdal-mrsid-3.13.3-3.tar.bz2"
size = 11419470
sha256 = "50a259e18875872d98305662a79b8b1dc86846dff485b3ecf8dd1176f1fc7e1f"
licence_path = "x86_64/release/gdal/gdal-dev/gdal-dev-mrsid/gdal-dev-mrsid-3.14.0-1187-18642a1c44-1.txt"
licence_sha256 = "d1afc241d67e8a3b038abbf6e0c8615dbed2b7ba459473b8e9712c0516b68eae"
plugin = "apps/gdal/lib/gdalplugins/gdal_MrSID.dll"
dlls = ["bin/lti_dsdk_9.5.dll", "bin/lti_dsdk_cdll_9.5.dll", "bin/lti_lidar_dsdk_1.1.dll", "bin/tbb.dll"]
notice = "Portions of this computer program are copyright (c) 1995-2018 Celartem, Inc., doing business as Extensis. All rights reserved."
caution = ""

[ecw]
