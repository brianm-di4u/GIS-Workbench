# Linux, H.264 (REQ-GAP-51): Cisco's own binary, fetched on the user's device after they accept its
# licence, and never in a package: Cisco's patent licence depends on both (BINARY_LICENSE.txt,
# conditions 1 and 2). libopenh264.so.8 must stay the soname bin/ffmpeg-h264 was linked against
# (sidecar/installer/build-ffmpeg-h264.sh). Cisco publishes no checksum for 2.7.0 (its .signed.md5.txt
# answers 403), so this SHA-256 is of the file downloaded over https on 2026-11-05.
[openh264]
mirror = "https://ciscobinary.openh264.org"
title = "OpenH264 Video Codec provided by Cisco Systems, Inc."
module = "vendor-openh264"
package = "libopenh264"
version = "2.7.0"
path = "libopenh264-2.7.0-linux64.8.so.bz2"
size = 628667
sha256 = "44ad0dd2c5af2bac84d26f89f2eb4e268708b8739323d15d33837f7221ce4980"
licence_path = "https://www.openh264.org/BINARY_LICENSE.txt"
licence_sha256 = "bd9f363c5ea11ef723d0304cddacb5273c43c0e1194097c7a045d05273635418"
plugin = ""
dlls = ["libopenh264.so.8"]
notice = "OpenH264 Video Codec provided by Cisco Systems, Inc."
caution = ""
