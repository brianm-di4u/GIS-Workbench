# Cuts a draft release, or promotes a published one to stable. It starts only by hand: the
# restricted agent token can't dispatch a workflow, and this repo has no way to reserve version
# tags on a personal account, so a tag pushed by anything else starts nothing here.
#
# The assets are built on the admin's PC and uploaded to the draft. See the release skill.
# At cut, the rebuild job builds the three HTML files again on Windows, the OS the admin builds
# on, attests them, and the draft gets their hashes as CI-SHA256SUMS. upload.mjs refuses staged
# HTML that doesn't match (decision #31).
name: release

on:
  workflow_dispatch:
    inputs:
      action:
        description: cut makes a draft prerelease. promote marks a published release as stable.
        type: choice
        options: [cut, promote]
        required: true
      version:
        description: The tag, such as v2.7.0 or v2.7.0-rc.1
        required: true
      sha:
        description: For cut, the full commit on main
        required: false

permissions: {}

jobs:
  check:
    if: ${{ inputs.action == 'cut' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: The version and commit have to be right
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]] || { echo "Not a version: $VERSION"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Give the full commit SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" HEAD || { echo "$SHA isn't on main"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null || { echo "$VERSION already exists"; exit 1; }
          file=$(git show "$SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          number=${VERSION#v}
          [ "$file" = "$number" ] || [ "$file" = "${number%%-*}" ] || { echo "package.json says $file"; exit 1; }

  app:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GWB_LEG: linux
      GWB_SCOPE: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/app-setup
      - run: npx playwright install --with-deps chromium
      - run: node .pipeline/verify.mjs full

  sidecar:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GWB_LEG: sidecar
      GWB_SCOPE: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/sidecar-setup
      - run: node .pipeline/verify.mjs full

  rebuild:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    # No signing permission here: npm, cargo and the pack fetch run third-party code.
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.hash.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the Rust toolchain from crates/rust-toolchain.toml
        shell: bash
        working-directory: crates
        run: rustup toolchain install
      - name: Install binaryen 133
        shell: bash
        run: |
          # Git Bash's tar reads "D:" as a remote host, so use the POSIX form of the temp path.
          t=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$t/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-windows.tar.gz
          echo "17a2cbeac6b5693c5fbafab3838d3c65fd9c1eb38b05f5baec6c657e8c84995b  $t/binaryen.tar.gz" | sha256sum -c -
          mkdir -p "$t/binaryen"
          tar -xzf "$t/binaryen.tar.gz" -C "$t/binaryen" --strip-components=1
          cygpath -w "$t/binaryen/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-deny@0.20.2
      - run: npm ci --ignore-scripts
      - name: Fetch the pinned pack inputs
        shell: bash
        run: |
          # Each input is checked against its pinned SHA-256. A retry keeps what already matches.
          for i in 1 2 3; do node build/packs.mjs --fetch && exit 0; sleep 30; done
          exit 1
      - name: Build
        shell: bash
        run: |
          # --strict fails without wasm-opt or cargo-deny. The HTML lists every pack, so a skipped pack would change it.
          npm run build -- --strict 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -F 'skipped: its inputs are missing' "$RUNNER_TEMP/build.log"
      - name: Hash the HTML
        id: hash
        shell: bash
        run: |
          # The build's own SHA256SUMS lines for the three HTML files, checked again against the files.
          grep -E '^[0-9a-f]{64}  gis-workbench(-lite|-airgap)?\.html$' dist/SHA256SUMS | tee "$RUNNER_TEMP/CI-SHA256SUMS"
          [ "$(wc -l < "$RUNNER_TEMP/CI-SHA256SUMS")" -eq 3 ]
          (cd dist && sha256sum -c "$RUNNER_TEMP/CI-SHA256SUMS")
          echo "sums=$(base64 -w0 < "$RUNNER_TEMP/CI-SHA256SUMS")" >> "$GITHUB_OUTPUT"

  # Signs the rebuild's hashes. It runs no repository or third-party code, so only it can sign.
  attest:
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SUMS: ${{ needs.rebuild.outputs.sums }}
    steps:
      - run: echo "$SUMS" | base64 -d | tee "$RUNNER_TEMP/CI-SHA256SUMS"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/CI-SHA256SUMS

  draft:
    needs: [app, sidecar, rebuild, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      SUMS: ${{ needs.rebuild.outputs.sums }}
    steps:
      # CI-SHA256SUMS comes from the rebuild job's output, which only that job can write.
      - run: |
          echo "$SUMS" | base64 -d > "$RUNNER_TEMP/CI-SHA256SUMS"
          gh release create "$VERSION" "$RUNNER_TEMP/CI-SHA256SUMS" --target "$SHA" --draft --prerelease --title "$VERSION" --notes "Draft. Assets are uploaded and checked before this is published."

  promote:
    if: ${{ inputs.action == 'promote' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - run: gh release edit "$VERSION" --prerelease=false --latest
