# Notifies the admin of decision requests and acts on their commands. GitHub doesn't
# notify you of your own account's actions, and agents act as you, so the bot's
# @mention is what reaches you. Runs from the default branch and treats all issue
# text as data.
name: decisions

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  handle:
    if: ${{ !github.event.repository.private && !github.event.issue.pull_request && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .pipeline/monitor.mjs issue-event
        env:
          GITHUB_TOKEN: ${{ github.token }}
