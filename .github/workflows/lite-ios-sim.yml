# Lite in real Safari on the iOS Simulator (OD-2.23, REQ-HOST-05). The simulator exists only on macOS,
# and the Windows PCs this project is built on have no Mac to pair with, so a hosted macOS runner does
# it. Runs nightly, on pushes to the test branch, and in the release gates. It builds the app first.
# A failed scheduled run opens a triage issue, like nightly.yml.
name: Lite on iOS Simulator

on:
  push:
    branches: [test/lite-ios]
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-ios-sim
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the pinned test dependencies
        run: npm ci --ignore-scripts

      # The build checks crate licences with cargo-deny (REQ-RUST-09); the macOS image has no cargo-deny (#65).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-deny@0.20.2

      - name: Build the app
        run: npm run build

      - name: Install Appium and the XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Boot an iPhone with a Dynamic Island
        run: |
          UDID=$(node tests/ios/simulator/pick-device.mjs)
          echo "GW_SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20

      - name: Start the file server and Appium
        run: |
          mkdir -p reports/ios
          nohup node tests/tools/serve.mjs --root dist --port 8765 > reports/ios/serve.log 2>&1 &
          nohup appium --log-level info --log-no-colors > reports/ios/appium.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 1; done
          curl -sfI http://127.0.0.1:8765/gis-workbench-lite.html

      - name: Smoke test
        run: node --test --test-reporter=spec tests/ios/simulator/smoke.test.mjs

      - name: Run the suite
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/ios/results.xml tests/ios/simulator/lite.test.mjs

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-ios-simulator
          path: reports/ios/
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: simulator
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open one issue
        run: |
          gh label create triage --color fbca04 --force > /dev/null
          open=$(gh issue list --label triage --search "iOS simulator failed in:title" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "An issue is already open."; exit 0; fi
          gh issue create --label triage --title "iOS simulator failed" --body "The nightly Lite run on the iOS Simulator failed. Run: $RUN_URL"
