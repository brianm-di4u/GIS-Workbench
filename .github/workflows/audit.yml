# Opens an issue if the pipeline's branch protection has changed, and posts the
# weekly digest. This detects tampering rather than preventing it: agents share the
# owner's account, so see "Risks you're accepting" in dev-pipeline's docs/design.md.
name: audit

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .pipeline/monitor.mjs audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node .pipeline/monitor.mjs digest
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Only with a delegate configured: a backstop for delegate suspension, which re-runs the gate.
  delegates:
    needs: audit
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: delegates
        name: Stop here unless a delegate is configured
        run: node -e "const c = require('./pipeline.config.json'); console.log('on=' + (Array.isArray(c.delegates) && c.delegates.length > 0))" >> "$GITHUB_OUTPUT"
      # Re-running the gate computes change hashes, which needs the history.
      - if: ${{ steps.delegates.outputs.on == 'true' }}
        run: git fetch --quiet --unshallow origin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.delegates.outputs.on == 'true' }}
        with:
          node-version: 24
      - if: ${{ steps.delegates.outputs.on == 'true' }}
        run: node .pipeline/monitor.mjs delegates-audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
