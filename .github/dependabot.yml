version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Application dependencies come in one monthly group. Security fixes still arrive as they're
  # published, because they don't wait for the schedule, and they are batched in the same groups
  # (applies-to: security-updates) so one PR carries what is ready. This needs the admin's
  # "Dependabot security updates" switch on in the repository settings.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ['*']
      crates-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /sidecar
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      sidecar:
        patterns: ['*']
      sidecar-security:
        applies-to: security-updates
        patterns: ['*']
