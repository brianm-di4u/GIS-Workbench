name: App setup
description: The tools the app needs. wasm-opt and cargo-deny are required here, because the strict build fails without them.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - name: Install the Rust toolchain from crates/rust-toolchain.toml
      shell: bash
      working-directory: crates
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: crates
    - name: Install binaryen 133
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/binaryen"
        tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP/binaryen" --strip-components=1
        echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
    - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
      with:
        tool: cargo-deny@0.20.2
    - name: Install npm packages
      shell: bash
      run: npm ci --ignore-scripts
