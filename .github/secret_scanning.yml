# The throwaway test certificate key is public on purpose and protects nothing:
# fixtures/fx26/native/SOURCE.txt says how it was made. The relay wire contract's token is a fixed
# test token both test runners send; no relay accepts it outside the tests. .gitleaks.toml has the
# same two, plus a rule for browser key chords that only its generic-key check reports.
paths-ignore:
  - "fixtures/fx26/native/certs/**"
  - "sidecar/python/contract/relay-contract.json"
